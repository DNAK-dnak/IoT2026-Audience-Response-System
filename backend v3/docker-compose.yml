services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ars
      POSTGRES_PASSWORD: ars_dev_pw
      POSTGRES_DB: ars
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ars -d ars"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ars:ars_dev_pw@db:5432/ars
      MQTT_HOST: mosquitto
    ports:
      - "8000:8000"
    volumes:
      - ./web:/app/web          # the teacher page: edits show on browser refresh, no rebuild
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
