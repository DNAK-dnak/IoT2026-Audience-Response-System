<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Màn hình chiếu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Sân khấu cố định 1920x1080, co giãn vừa mọi màn hình; màu tương phản cao cho máy chiếu */
:root{
  --s:1; --z:1;
  --bg:#F3F6F5; --card:#FFFFFF; --fg:#16211E; --muted:#5E6C68; --line:#C9D3CF;
  --accent:#2F7D6E; --accent-soft:#DCEFEA;
  --ok:#23864F; --bad:#C0392B; --warn:#B7791F;
  --f:"Be Vietnam Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0D1311;overflow:hidden;font-family:var(--f);color:var(--fg)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--bg);
  transform:translate(-50%,-50%) scale(var(--s));transform-origin:center;overflow:hidden}
.hd{position:absolute;left:48px;right:48px;top:28px;height:84px;display:flex;justify-content:space-between;align-items:center;gap:32px}
.hd .t{font-size:34px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t small{display:block;font-size:22px;font-weight:500;color:var(--muted);letter-spacing:0}
.chip{flex:none;font-size:26px;font-weight:700;padding:10px 26px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
[hidden]{display:none!important}
main{position:absolute;left:48px;right:48px;top:132px;bottom:100px}
main.withclock{bottom:180px}
.foot{position:absolute;left:48px;bottom:40px;font-size:30px;color:var(--muted);display:flex;gap:40px;align-items:center}
.foot b{color:var(--fg);font-family:var(--mono)}
.legend{display:inline-flex;align-items:center;gap:12px}
.legend i{width:30px;height:30px;border-radius:8px;display:inline-block}

/* lưới 60 ô: 10 cột x 6 hàng */
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:14px;height:100%}
.cell{container-type:size;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;border:3px solid transparent}
.cell .cid{position:absolute;left:8%;top:6%;font-family:var(--mono);font-weight:700;font-size:calc(var(--z) * min(13cqw,22cqh));opacity:.75}
.cell .big{font-family:var(--mono);font-weight:700;font-size:calc(var(--z) * min(17cqw,34cqh));line-height:1;white-space:nowrap;margin-top:12%}
.cell .small{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-family:var(--mono);font-weight:500;font-size:calc(var(--z) * min(11cqw,18cqh));opacity:.9}
.cell.reg{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.cell.reg .cid{color:var(--accent);opacity:1}
.cell.empty{border:3px dashed var(--line);color:var(--line)}
.cell.empty .big{font-size:calc(var(--z) * min(14cqw,26cqh));margin:0}
.cell.done{background:var(--ok);color:#fff}
.cell.miss{background:var(--bad);color:#fff}
.cell.done .big,.cell.miss .big{font-size:calc(var(--z) * min(30cqw,46cqh));margin:0 0 10%}
.cell.blank{visibility:hidden}

/* câu hỏi */
.q{display:grid;grid-template-rows:auto auto 1fr;gap:28px;height:100%}
.qn{font-family:var(--mono);font-size:30px;color:var(--muted);font-weight:700}
.qt{font-size:calc(var(--z) * 54px);font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:24px;align-content:start}
.op{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:26px 30px;display:flex;gap:26px;align-items:center;font-size:calc(var(--z) * 40px);font-weight:500;line-height:1.3;min-height:150px}
.op b{flex:none;width:76px;height:76px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:44px}

/* đồng hồ góc dưới phải */
.clock{position:absolute;right:48px;bottom:32px;min-width:400px;height:128px;border-radius:20px;background:var(--fg);color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:28px;padding:0 34px}
.clock .l{font-size:24px;font-weight:600;line-height:1.25;max-width:220px;opacity:.85}
.clock .n{font-family:var(--mono);font-size:88px;font-weight:700;line-height:1}
.clock.hot{background:var(--bad)}
.clock.idle .n{font-size:40px;font-family:var(--f)}

.center{height:100%;display:grid;place-items:center;text-align:center}
.center h1{font-size:96px;margin:0 0 24px;letter-spacing:-.02em}
.center p{font-size:40px;color:var(--muted);margin:0}

.banner{position:absolute;left:50%;top:132px;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:26px;font-weight:600;padding:12px 30px;border-radius:12px;z-index:3;white-space:nowrap}

/* công cụ (ngoài sân khấu, tự ẩn) */
.tools{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:10;transition:opacity .3s}
.tools.hide{opacity:0;pointer-events:none}
.tools button{font:600 14px var(--f);border:1px solid #3b4a45;background:#1d2724;color:#e5ecea;border-radius:8px;padding:8px 12px;cursor:pointer}
.tools span{font:600 14px var(--mono);color:#e5ecea;align-self:center;padding:0 6px}
body.nocursor{cursor:none}
</style>
</head>
<body>
<div id="stage">
  <header class="hd"><div class="t" id="title">Phòng Thi Clicker</div><div class="chip" id="chip">Chờ</div></header>
  <div class="banner" id="banner" hidden></div>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
  <div class="clock" id="clock" hidden><div class="l" id="clockL"></div><div class="n" id="clockN"></div></div>
</div>
<div class="tools" id="tools">
  <button id="zOut" title="Thu nhỏ chữ (phím −)">A−</button><span id="zVal">100%</span><button id="zIn" title="Phóng to chữ (phím +)">A+</button>
  <button id="zReset" title="Cỡ chữ mặc định (phím 0)">Mặc định</button>
  <button id="fs" title="Toàn màn hình (phím F)">Toàn màn hình</button>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SLOTS=60, L=['A','B','C','D'];
let st=null, lastMsg=0, lastSig='', nextAt=0, frozen=null;

/* co giãn sân khấu 1920x1080 */
function fit(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080));}
addEventListener('resize',fit); fit();

/* cỡ chữ trong ô */
let z=1; try{z=+localStorage.getItem('ars-proj-zoom')||1;}catch(e){}
function setZ(v){z=Math.round(Math.min(1.8,Math.max(.5,v))*10)/10;document.documentElement.style.setProperty('--z',z);$('#zVal').textContent=Math.round(z*100)+'%';try{localStorage.setItem('ars-proj-zoom',z);}catch(e){}}
setZ(z);
$('#zIn').onclick=()=>setZ(z+.1); $('#zOut').onclick=()=>setZ(z-.1); $('#zReset').onclick=()=>setZ(1);
const toggleFS=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{});
$('#fs').onclick=toggleFS;
addEventListener('dblclick',toggleFS);
addEventListener('keydown',e=>{
  if(e.key==='+'||e.key==='=')setZ(z+.1); else if(e.key==='-'||e.key==='_')setZ(z-.1);
  else if(e.key==='0')setZ(1); else if(e.key==='f'||e.key==='F')toggleFS();
});
let hideT; const wake=()=>{$('#tools').classList.remove('hide');document.body.classList.remove('nocursor');clearTimeout(hideT);
  hideT=setTimeout(()=>{$('#tools').classList.add('hide');document.body.classList.add('nocursor');},2500);};
addEventListener('mousemove',wake); wake();

/* nhận trạng thái từ trang giáo viên */
const chan='BroadcastChannel' in window?new BroadcastChannel('ars-projector'):null;
if(chan){
  chan.onmessage=e=>{
    const d=e.data; if(!d||d.type!=='state')return;
    lastMsg=Date.now(); st=d;
    const n=d.next;
    if(n&&n.kind==='auto'){if(n.running){nextAt=Date.now()+n.left*1000;frozen=null;}else frozen=n.left;}
    else{nextAt=0;frozen=null;}
    const sig=JSON.stringify({...d,sentAt:0,next:n?{...n,left:0}:null});
    if(sig!==lastSig){lastSig=sig;render();}
    tick();
  };
  chan.postMessage({type:'hello'});
}

function render(){
  const m=$('#main'), foot=$('#foot');
  m.className=''; foot.innerHTML='';
  if(!st){$('#title').innerHTML='Phòng Thi Clicker';$('#chip').textContent='Chờ';
    m.innerHTML=`<div class="center"><div><h1>Phòng Thi Clicker</h1><p>${chan?'Đang chờ trang giáo viên…':'Trình duyệt không hỗ trợ kết nối màn hình chiếu. Hãy dùng Chrome hoặc Edge bản mới.'}</p></div></div>`;return;}
  $('#title').innerHTML=`${esc(st.exam)}<small>${esc(st.title)}</small>`;
  const devs=st.devices||[];
  if(st.mode==='register'){
    $('#chip').textContent='Đăng ký thiết bị';
    let h='';
    for(let i=0;i<SLOTS;i++){const d=devs[i];
      h+=d?`<div class="cell reg"><span class="cid">${esc(d.id)}</span><span class="big">${esc(d.mssv)}</span></div>`
          :`<div class="cell empty"><span class="big">${i+1}</span></div>`;}
    m.innerHTML=`<div class="grid">${h}</div>`;
    foot.innerHTML=`<span>Đã đăng ký <b>${devs.length}</b> / ${SLOTS} thiết bị</span><span>Nhập MSSV trên thiết bị và gửi. Kiểm tra số trên màn hình đúng với MSSV của bạn.</span>`;
  }
  else if(st.mode==='question'&&st.q){
    $('#chip').textContent=`Câu ${st.q.num} / ${st.q.total}`;
    m.className='withclock';
    m.innerHTML=`<div class="q"><div class="qn">CÂU ${st.q.num} / ${st.q.total}</div><h1 class="qt">${esc(st.q.text)}</h1>
      <div class="opts">${st.q.opts.map((o,j)=>`<div class="op"><b>${L[j]}</b><span>${esc(o)}</span></div>`).join('')}</div></div>`;
    const n=devs.filter(d=>d.done).length;
    foot.innerHTML=`<span>Đã nhận <b>${n}</b> / ${devs.length}</span>`;
  }
  else if(st.mode==='review'&&st.q){
    $('#chip').textContent=`Kết quả nộp · Câu ${st.q.num}`;
    m.className='withclock';
    let h='';
    for(let i=0;i<SLOTS;i++){const d=devs[i];
      h+=d?`<div class="cell ${d.done?'done':'miss'}"><span class="big">${esc(d.id)}</span><span class="small">${esc(d.mssv)}</span></div>`:`<div class="cell blank"></div>`;}
    m.innerHTML=`<div class="grid">${h}</div>`;
    const n=devs.filter(d=>d.done).length;
    foot.innerHTML=`<span>Câu ${st.q.num}: đã nhập <b>${n}</b> / ${devs.length}</span>
      <span class="legend"><i style="background:var(--ok)"></i>Đã nhập</span><span class="legend"><i style="background:var(--bad)"></i>Chưa nhập</span>`;
  }
  else if(st.mode==='done'){
    $('#chip').textContent='Đã kết thúc';
    m.innerHTML=`<div class="center"><div><h1>Bài kiểm tra đã kết thúc</h1><p>Cảm ơn các bạn. Giáo viên đang tổng hợp kết quả.</p></div></div>`;
  }
  else{
    $('#chip').textContent='Chờ';
    m.innerHTML=`<div class="center"><div><h1>Phòng Thi Clicker</h1><p>Đang chờ giáo viên mở phiên kiểm tra…</p></div></div>`;
  }
}

/* đồng hồ + cảnh báo, cập nhật 4 lần/giây */
function tick(){
  const c=$('#clock'), now=Date.now();
  const lost=chan&&lastMsg&&now-lastMsg>6000, ban=$('#banner');
  if(lost){ban.hidden=false;ban.textContent='Mất liên lạc với trang giáo viên. Kiểm tra cửa sổ điều khiển.';}
  else if(st&&!st.online&&st.mode!=='standby'){ban.hidden=false;ban.textContent='Máy chủ đang mất kết nối · thời gian vẫn chạy';}
  else ban.hidden=true;
  if(!st){c.hidden=true;return;}
  c.className='clock';
  if(st.mode==='question'){
    const left=Math.max(0,Math.ceil((st.deadlineAt-now)/1000));
    c.hidden=false; $('#clockL').textContent=left>0?'Thời gian còn lại':'Hết giờ'; $('#clockN').textContent=left;
    if(left<=5)c.classList.add('hot');
  }
  else if(st.mode==='review'&&st.next){
    c.hidden=false; const n=st.next;
    if(n.kind==='auto'){
      const left=frozen!=null?frozen:Math.max(0,Math.ceil((nextAt-now)/1000));
      $('#clockL').textContent=n.last?'Kết thúc bài sau':'Câu tiếp theo sau'; $('#clockN').textContent=left;
    }else{
      c.classList.add('idle');
      $('#clockL').textContent=n.last?'Kết thúc bài':'Câu tiếp theo';
      $('#clockN').textContent=n.kind==='paused'?'Tạm dừng':n.kind==='wait-server'?'Đang nối lại…':'Chờ giáo viên';
    }
  }
  else c.hidden=true;
}
setInterval(tick,250);
render();
</script>
</body></html>
