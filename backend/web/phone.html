<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clicker điện thoại</title>
<!-- mqtt.js is stored locally (no internet needed in the classroom) -->
<script src="vendor/mqtt-5.16.0.min.js"></script>
<style>
/* Phone clicker: speaks MQTT over WebSocket to Mosquitto, with exactly the same topics and
   messages as a real Pico clicker. The backend cannot tell the difference. */
:root{
  --bg:#E4E8E6; --surface:#EDF0EE; --panel:#DCE2DF; --line:#CBD3CF;
  --fg:#2F3836; --muted:#6F7B77; --accent:#5E8C84; --on-accent:#F2F6F4;
  --ok:#5F8F67; --bad:#A86F68; --warn:#A38A53;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1F2523; --surface:#29302E; --panel:#323A37; --line:#3E4844;
  --fg:#D3DBD8; --muted:#8B9793; --accent:#80AAA2; --on-accent:#1F2624;
  --ok:#8DB393; --bad:#C89A93; --warn:#C8B07A; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header b{font-size:18px}
.mono{font-family:ui-monospace,"JetBrains Mono",monospace}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px}
.dot.on{background:var(--ok)}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.phase{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-size:26px;font-weight:700;margin:4px 0}
.muted{color:var(--muted)}
input{width:100%;font:inherit;font-size:24px;letter-spacing:.12em;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:12px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45}
.abcd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.abcd button{font-size:44px;font-weight:700;height:min(26vw,130px);border-radius:var(--r);background:var(--surface)}
.abcd button.sent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ack{font-weight:600}
.ack.OK{color:var(--ok)} .ack.wait{color:var(--warn)} .ack.err{color:var(--bad)}
.timer{font-size:40px;font-weight:700;text-align:right}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
details{font-size:14px}
details .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
details label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
details input{font-size:16px;letter-spacing:0;padding:8px 10px}
.log{font-size:12px;max-height:140px;overflow:auto;margin:8px 0 0;padding:0;list-style:none}
.log li{padding:2px 0;border-bottom:1px dashed var(--line)}
.abcd button.sel{outline:3px solid var(--accent);outline-offset:-3px}
.abcd button.locked{background:var(--ok);color:var(--on-accent);border-color:var(--ok)}
.abcd button.locked:disabled{opacity:1}
.confirm{width:100%;margin-top:12px;font-size:20px;padding:16px}
.lock{margin-top:12px;padding:12px 14px;border-radius:10px;font-weight:600}
.lock.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.lock.no{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.lock.wait{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
</style>
</head>
<body>
<header>
  <div><b>Thiết bị <span class="mono" id="devNo">--</span></b> <span class="muted" id="roomLbl"></span></div>
  <div class="muted" style="font-size:14px"><span class="dot" id="dot"></span><span id="connTxt">đang kết nối…</span></div>
</header>

<main>
  <div class="card" id="screen"></div>
  <div class="card"><div class="row"><span class="muted">Phản hồi máy chủ</span><span class="ack" id="ack">—</span></div></div>

  <details class="card">
    <summary>Cài đặt thiết bị</summary>
    <div class="grid">
      <label>Số thiết bị (1–60)<input id="cfgDev" type="number" min="1" max="60" inputmode="numeric"></label>
      <label>Phòng<input id="cfgRoom"></label>
    </div>
    <p class="muted" style="font-size:12px;margin:8px 0">Mỗi điện thoại một số khác nhau, và khác số của thiết bị giả
      (ví dụ thiết bị giả 1–50, điện thoại 51–60).</p>
    <div class="row">
      <button id="cfgSave" class="primary">Lưu và kết nối lại</button>
      <button id="reboot" title="seq quay về 1, giống Pico bị khởi động lại">Mô phỏng khởi động lại</button>
    </div>
    <ul class="log" id="log"></ul>
  </details>
</main>

<script>
/* ===================================================================
   Same contract as the Pico clicker:
     listen  ars/{room}/state             (retained) {"phase","q","n_choices","deadline_ms"}
     listen  ars/{room}/dev/{NN}/ack      {"seq","code"}  + for answers OK/LOCKED: {"q","choice"}
     send    ars/{room}/dev/{NN}/register {"dev","mssv","seq","hw"}
     send    ars/{room}/dev/{NN}/answer   {"dev","q","choice","seq"}

   Answering: pick A-D (only on the device, nothing is sent), then press "Xác nhận".
   The answer is LOCKED only when the SERVER says so: the ack OK / LOCKED carries the locked
   choice and the device shows exactly that. The device never decides by itself.
   seq goes up by 1 for every message and is kept across page reloads (like flash memory);
   no ack within 1.5 s -> resend the SAME message (max 3 tries).
   =================================================================== */
const $ = s => document.querySelector(s);
const LETTERS = ['A','B','C','D'];
const ACK_TIMEOUT = 1500, TRIES = 3;
const P = new URLSearchParams(location.search);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('clicker.'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('clicker.'+k, JSON.stringify(v)); }catch(e){} },
};

const C = {
  dev: +(P.get('dev') || store.get('dev', 51 + Math.floor(Math.random()*10))),
  room: P.get('room') || store.get('room', 'room1'),
};
const D = {                     // device state
  seq: store.get('seq.'+C.dev, 0),
  mssv: store.get('mssv', ''),
  registered: false,
  regError: '',
  state: null,                  // last state message
  deadlineAt: 0,
  sel: {},                      // q -> letter selected on the device (NOT sent yet)
  locked: {},                   // q -> letter the SERVER confirmed as locked
  err: {},                      // q -> why the last confirm did not lock
  pending: null,                // {seq, kind, msg, tries, t0, timer}
};
let client = null, tick = null;
const pad = n => String(n).padStart(2,'0');
const topic = kind => `ars/${C.room}/dev/${pad(C.dev)}/${kind}`;

/* ---------- MQTT ---------- */
function connect(){
  if (client) client.end(true);
  $('#devNo').textContent = pad(C.dev); $('#roomLbl').textContent = '· ' + C.room;
  $('#cfgDev').value = C.dev; $('#cfgRoom').value = C.room;
  // Mosquitto WebSocket listener: same machine that serves this page, port 9001
  const url = P.get('broker') || `ws://${location.hostname}:9001`;
  client = mqtt.connect(url, {
    clientId: `phone-${C.room}-${pad(C.dev)}-${Math.random().toString(16).slice(2,6)}`,
    clean: true, reconnectPeriod: 2000, connectTimeout: 5000,
  });
  client.on('connect', () => {
    setConn(true);
    client.subscribe([`ars/${C.room}/state`, topic('ack')], {qos: 1});
  });
  client.on('close', () => setConn(false));
  client.on('error', e => log('lỗi MQTT: ' + e.message));
  client.on('message', (t, buf) => {
    let m; try{ m = JSON.parse(buf.toString()); }catch(e){ return; }
    if (t.endsWith('/state')) onState(m); else onAck(m);
  });
}
function setConn(ok){
  $('#dot').classList.toggle('on', ok);
  $('#connTxt').textContent = ok ? 'đã kết nối' : 'mất kết nối…';
}

function send(kind, body){
  if (D.pending) clearTimeout(D.pending.timer);
  D.seq += 1; store.set('seq.'+C.dev, D.seq);
  const msg = {dev: C.dev, ...body, seq: D.seq};
  D.pending = {seq: D.seq, kind, msg, tries: 0, t0: performance.now()};
  setAck('đang gửi…', 'wait');
  attempt(); render();
}
function attempt(){
  const p = D.pending; if (!p) return;
  if (!client || !client.connected) { log('chưa kết nối, sẽ gửi lại'); }
  else { client.publish(topic(p.kind), JSON.stringify(p.msg), {qos: 1}); }
  p.tries += 1;
  log(`→ ${p.kind} seq ${p.msg.seq}${p.tries > 1 ? ' (gửi lại ' + p.tries + ')' : ''}`);
  p.timer = setTimeout(() => {
    if (D.pending !== p) return;
    if (p.tries < TRIES) { attempt(); return; }
    D.pending = null;
    setAck('không có phản hồi', 'err');
    if (p.kind === 'answer') D.err[p.msg.q] = 'không có phản hồi từ máy chủ (sóng yếu / mất kết nối) — bấm Xác nhận để gửi lại';
    else D.regError = 'không có phản hồi từ máy chủ — gửi lại MSSV';
    render();
  }, ACK_TIMEOUT);
}

const WHY = {
  register: {NOT_IN_CLASS: 'MSSV không có trong danh sách lớp', DUP: 'MSSV đã được dùng trên thiết bị khác',
             BAD: 'MSSV phải có 8 chữ số', CLOSED: 'đã hết thời gian đăng ký'},
  answer:   {CLOSED: 'câu hỏi đã đóng / hết giờ', UNREGISTERED: 'thiết bị chưa đăng ký MSSV trong phiên này',
             DUP: 'thiết bị vừa khởi động lại (số thứ tự tin nhắn cũ) — gửi lại MSSV để đồng bộ',
             BAD: 'tín hiệu bị lỗi'},
};
function onAck(a){
  if (a.code === 'REMOVED') {                         // the teacher removed this device (registration phase)
    D.registered = false; D.regError = 'giáo viên đã xóa thiết bị: nhập lại MSSV';
    log('← REMOVED'); setAck(D.regError, 'err'); render(); return;
  }
  const p = D.pending;
  if (!p || a.seq !== p.seq) return;                  // ack for an older message
  clearTimeout(p.timer); D.pending = null;
  const ms = Math.round(performance.now() - p.t0);
  log(`← ${a.code}${a.choice ? ' ' + LETTERS[a.choice - 1] : ''} seq ${a.seq} · ${ms} ms`);
  if (p.kind === 'register') {
    D.registered = a.code === 'OK';
    D.regError = D.registered ? '' : (WHY.register[a.code] || a.code);
    setAck(D.registered ? `đã đăng ký ✓ · ${ms} ms` : D.regError, D.registered ? 'OK' : 'err');
  } else {
    const q = p.msg.q;
    if ((a.code === 'OK' || a.code === 'LOCKED') && a.choice) {
      D.locked[q] = LETTERS[a.choice - 1];           // the server says what is locked
      delete D.err[q];
      setAck(`${a.code === 'OK' ? 'đã khoá' : 'đã khoá trước đó'} ${D.locked[q]} ✓ · ${ms} ms`, 'OK');
    } else {
      D.err[q] = WHY.answer[a.code] || a.code;
      if (a.code === 'UNREGISTERED' || a.code === 'DUP') D.registered = false;
      setAck('chưa khoá · ' + a.code, 'err');
    }
  }
  render();
}
function setAck(t, cls){ const e = $('#ack'); e.textContent = t; e.className = 'ack ' + cls; }
function log(t){
  const li = document.createElement('li');
  li.textContent = new Date().toLocaleTimeString() + '  ' + t;
  $('#log').prepend(li);
  while ($('#log').children.length > 30) $('#log').lastChild.remove();
}

/* ---------- state from the server ---------- */
function onState(s){
  const prev = D.state;
  if (s.phase === 'REGISTER' && (!prev || prev.phase !== 'REGISTER')) {     // a new session
    D.registered = false; D.regError = ''; D.sel = {}; D.locked = {}; D.err = {};
  }
  if (s.phase === 'QUESTION_OPEN') D.deadlineAt = Date.now() + (s.deadline_ms || 0);
  D.state = s;
  render();
}

/* ---------- screens ---------- */
function render(){
  const s = D.state, el = $('#screen');
  clearInterval(tick);
  if (!s || s.phase === 'IDLE') {
    el.innerHTML = `<div class="phase">Chờ</div><div class="big">Chờ giáo viên mở phiên</div>`;
    return;
  }
  if (s.phase === 'ENDED') {
    el.innerHTML = `<div class="phase">Kết thúc</div><div class="big">Bài kiểm tra đã kết thúc</div>`;
    return;
  }
  const sending = D.pending && D.pending.kind === 'register';
  const regForm = (title) => `
    <div class="phase">${title}</div>
    <div class="big">${D.registered ? 'Đã đăng ký' : 'Nhập MSSV'}</div>
    <div style="display:grid;gap:10px;margin-top:8px">
      <input id="mssv" inputmode="numeric" maxlength="8" placeholder="8 chữ số" value="${D.mssv}">
      <button class="primary" id="regBtn" ${sending ? 'disabled' : ''}>${sending ? 'Đang gửi…' : D.registered ? 'Gửi lại MSSV' : 'Gửi MSSV'}</button>
    </div>
    ${D.regError ? `<div class="lock no">Chưa đăng ký: ${D.regError}</div>` : ''}`;
  if (s.phase === 'REGISTER') {
    el.innerHTML = regForm('Đăng ký') +
      (D.registered ? `<div class="lock ok">Máy chủ đã nhận MSSV <span class="mono">${D.mssv}</span> · chờ câu hỏi đầu tiên</div>` : '');
    bindReg(); return;
  }
  if (s.phase === 'QUESTION_OPEN') {
    const n = s.n_choices || 4, q = s.q, locked = D.locked[q], sel = D.sel[q];
    const waiting = D.pending && D.pending.kind === 'answer' && D.pending.msg.q === q;
    const status = locked
      ? `<div class="lock ok">Đã khoá đáp án <b>${locked}</b> ✓ <span style="font-weight:400">· máy chủ đã xác nhận</span></div>`
      : waiting ? `<div class="lock wait">Đang gửi ${sel}… chưa khoá</div>`
      : D.err[q] ? `<div class="lock no">Chưa khoá đáp án: ${D.err[q]}</div>`
      : `<div class="lock wait">${sel ? 'Đã chọn ' + sel + ' · bấm Xác nhận để khoá' : 'Chọn một đáp án rồi bấm Xác nhận'}</div>`;
    el.innerHTML = `
      <div class="row"><div><div class="phase">Đang mở</div><div class="big">Câu ${q}</div></div>
        <div class="timer mono" id="left"></div></div>
      <div class="abcd" style="margin-top:12px">${LETTERS.slice(0, n).map(l =>
        `<button data-l="${l}" class="${locked === l ? 'locked' : (!locked && sel === l ? 'sel' : '')}" ${locked || waiting ? 'disabled' : ''}>${l}</button>`).join('')}</div>
      ${locked ? '' : `<button class="primary confirm" id="confirm" ${!sel || waiting ? 'disabled' : ''}>Xác nhận ${sel || ''}</button>`}
      ${status}
      ${D.registered || locked ? '' : `<details style="margin-top:10px"><summary class="muted">Chưa đăng ký trên trang này? Gửi lại MSSV</summary>${regForm('Đăng ký lại')}</details>`}`;
    el.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { D.sel[q] = b.dataset.l; delete D.err[q]; render(); });
    const c = $('#confirm');
    if (c) c.onclick = () => send('answer', {q, choice: LETTERS.indexOf(D.sel[q]) + 1});
    if (!D.registered && !locked) bindReg();
    const draw = () => { const l = Math.max(0, Math.ceil((D.deadlineAt - Date.now()) / 1000)); const e = $('#left'); if (e) e.textContent = l + 's'; };
    draw(); tick = setInterval(draw, 250);
    return;
  }
  if (s.phase === 'QUESTION_CLOSED') {
    const locked = D.locked[s.q];
    el.innerHTML = `<div class="phase">Đã đóng</div><div class="big">Câu ${s.q}</div>
      ${locked ? `<div class="lock ok">Đáp án đã khoá: <b>${locked}</b></div>`
               : `<div class="lock no">Không có đáp án nào được khoá cho câu này${D.err[s.q] ? ' (' + D.err[s.q] + ')' : ''}</div>`}
      <p class="muted" style="margin:10px 0 0">Chờ câu tiếp theo</p>`;
  }
}
function bindReg(){
  const b = $('#regBtn'); if (!b) return;
  b.onclick = () => {
    const v = $('#mssv').value.replace(/\D/g, '');
    if (v.length !== 8) { D.regError = 'MSSV phải có 8 chữ số'; render(); return; }
    D.mssv = v; store.set('mssv', v); D.regError = '';
    send('register', {mssv: v, hw: 'phone'});
  };
}

/* ---------- settings ---------- */
$('#cfgSave').onclick = () => {
  const dev = +$('#cfgDev').value;
  if (!(dev >= 1 && dev <= 60)) { setAck('Số thiết bị phải từ 1 đến 60', 'err'); return; }
  C.dev = dev; C.room = $('#cfgRoom').value.trim() || 'room1';
  store.set('dev', C.dev); store.set('room', C.room);
  D.seq = store.get('seq.' + C.dev, 0); D.registered = false; D.state = null; D.pending = null;
  D.sel = {}; D.locked = {}; D.err = {};
  connect(); render();
};
$('#reboot').onclick = () => {
  D.seq = 0; store.set('seq.' + C.dev, 0); D.registered = false; D.pending = null;
  D.sel = {}; D.locked = {}; D.err = {};
  log('khởi động lại: seq = 0'); setAck('đã khởi động lại (seq về 0)', 'wait'); render();
};

connect(); render();
</script>
</body>
</html>
